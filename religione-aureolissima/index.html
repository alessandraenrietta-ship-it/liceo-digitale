<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aureolissima — Punti Paradiso</title>
<style>
:root{
  --cielo:#e9f1fb;
  --cielo-scuro:#c8ddf3;
  --notte:#111c33;
  --notte-2:#1d2c4a;
  --inchiostro:#16233c;
  --azzurro:#2c6bad;
  --azzurro-chiaro:#5b93cf;
  --oro:#c4941f;
  --oro-chiaro:#f2cf72;
  --carta:#ffffff;
  --bordo:#ccdcee;
  --testo-soft:#5a6b82;
  --rosso:#a33a3a;
  --verde:#2f7a52;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--inchiostro);
  background:var(--cielo);
  background-image:
    radial-gradient(1100px 520px at 50% -180px, #ffffff 0%, rgba(255,255,255,0) 70%),
    radial-gradient(700px 400px at 90% 110%, #dbe9f9 0%, rgba(219,233,249,0) 70%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px 64px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:clamp(28px,4.2vw,44px);line-height:1.08}
h2{font-size:clamp(21px,2.6vw,30px);line-height:1.15}
h3{font-size:19px}
p{line-height:1.6;margin:.5em 0}
a{color:var(--azzurro)}
small{color:var(--testo-soft)}

/* ---- intestazione ---- */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 18px}
.marchio{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.aureola-logo{width:38px;height:38px;flex:0 0 38px;border-radius:50%;
  border:3px solid var(--oro);box-shadow:0 0 0 4px #fff,0 3px 12px rgba(196,148,31,.35);
  background:linear-gradient(160deg,#fff,#eaf3ff)}
.marchio b{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.3px}
.marchio span{display:block;font-size:12.5px;color:var(--testo-soft);margin-top:1px}

/* ---- bottoni ---- */
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--carta);color:var(--inchiostro);border:1px solid var(--bordo);
  border-radius:999px;padding:10px 18px;font-size:15px;font-weight:500;
  box-shadow:0 1px 2px rgba(22,35,60,.06)}
.btn:hover{border-color:var(--azzurro-chiaro)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:3px solid var(--oro);outline-offset:2px}
.btn.primario{background:var(--azzurro);border-color:var(--azzurro);color:#fff}
.btn.primario:hover{background:#25598f}
.btn.oro{background:linear-gradient(170deg,#f6dc98,#e0b44a);border-color:#cfa53c;color:#3b2c06}
.btn.cupo{background:var(--notte);border-color:var(--notte);color:#e7ecf6}
.btn.fantasma{background:transparent;border-color:transparent;color:var(--testo-soft);padding:10px 12px}
.btn.piccolo{padding:7px 13px;font-size:13.5px}
.btn.pieno{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.barra-azioni{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---- superfici ---- */
.pannello{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--r);
  padding:20px;box-shadow:0 10px 26px rgba(22,35,60,.07)}
.griglia{display:grid;gap:14px}
.g-classi{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g-slot{grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.vuoto{border:1px dashed var(--bordo);border-radius:var(--r);padding:26px;text-align:center;color:var(--testo-soft);background:rgba(255,255,255,.6)}
.riga{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tra{height:1px;background:var(--bordo);border:0;margin:18px 0}
.pila{display:grid;gap:12px}

/* ---- slot studente ---- */
.slot{position:relative;background:var(--carta);border:1px solid var(--bordo);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;
  box-shadow:0 8px 20px rgba(22,35,60,.06)}
.slot .nome{font-family:var(--serif);font-size:20px;line-height:1.2;word-break:break-word}
.slot .santo{font-size:12.5px;color:var(--testo-soft);line-height:1.35}
.pp{display:flex;align-items:baseline;gap:6px;font-family:var(--serif)}
.pp b{font-size:32px;color:var(--azzurro);letter-spacing:-.5px}
.pp i{font-style:normal;font-size:12px;color:var(--testo-soft)}

/* ---- aureola ---- */
.aur{display:block;margin:0 auto;overflow:visible}
.aur .arco{fill:none;stroke:#e1eaf5;stroke-width:4.5;stroke-linecap:round}
.aur .prog{fill:none;stroke:#e0b44a;stroke-width:4.5;stroke-linecap:round;
  filter:drop-shadow(0 0 4px rgba(216,168,44,.55))}
.aur .ad{fill:#f1f5fa;stroke:#cddcec;stroke-width:1.4}
.aur .ad.on{fill:#f7d987;stroke:#c69a2e}
.aur .ad.tap.on{filter:drop-shadow(0 0 6px rgba(216,168,44,.9))}
.aur .num{font-family:var(--serif);fill:var(--azzurro);font-weight:600}
.aur .num.pieno{fill:#b98d1b}
.aur .eti{font-family:var(--sans);fill:#8fa2b8;font-size:8px;letter-spacing:.6px}
.aureolato{text-align:center}

/* ---- bollini aureola ---- */
.bollini{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.boll{width:14px;height:14px;border-radius:50%;background:#eef3f9;border:1.5px solid var(--bordo)}
.boll.on{background:linear-gradient(160deg,#fbe6ac,#dcae3e);border-color:#c69a2e}
.boll.tappa{width:19px;height:19px;border-width:2px}
.boll.tappa.on{box-shadow:0 0 0 3px rgba(226,186,86,.35),0 0 10px rgba(216,168,44,.6)}
.bollini.grandi .boll{width:19px;height:19px}
.bollini.grandi .boll.tappa{width:26px;height:26px}

/* ---- moduli ---- */
label{display:block;font-size:13px;color:var(--testo-soft);margin:0 0 5px}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--bordo);
  border-radius:10px;background:#fbfdff;color:var(--inchiostro)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.campo{margin-bottom:14px}
.due{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.due{grid-template-columns:1fr}}

/* ---- etichette ---- */
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;
  background:#eef4fb;color:var(--azzurro);border:1px solid var(--bordo)}
.tag.attesa{background:#fdf4e0;color:#8a6a12;border-color:#ecd9a8}
.tag.ok{background:#e8f4ec;color:var(--verde);border-color:#bfe0cc}
.tag.no{background:#f9eaea;color:var(--rosso);border-color:#e8c9c9}
.pallino{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  padding:0 6px;border-radius:999px;background:var(--oro);color:#3b2c06;font-size:12.5px;font-weight:700}

/* ---- registro ---- */
.mov{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eef2f7}
.mov:last-child{border-bottom:0}
.mov .delta{font-family:var(--serif);font-size:19px;min-width:52px;text-align:right}
.delta.su{color:var(--verde)}
.delta.giu{color:var(--rosso)}
.mov .causale{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.mov .ora{font-size:12px;color:var(--testo-soft);white-space:nowrap}

/* ---- mazzo di san pietro ---- */
.tavolo{background:var(--notte);border-radius:22px;padding:26px;color:#e8eefb;
  background-image:radial-gradient(600px 300px at 50% 0%,rgba(96,140,200,.35),rgba(0,0,0,0) 70%)}
.tavolo h2{color:#fff}
.tavolo .sottotitolo{color:#a9bbd8;font-size:14px;margin-top:4px}
.carta{margin:22px auto 0;max-width:660px;border-radius:20px;padding:34px 30px;text-align:center;
  border:2px solid transparent;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.carta .genere{font-family:var(--serif);font-size:15px;letter-spacing:2px;opacity:.85}
.carta .testo{font-family:var(--serif);font-size:clamp(23px,3.4vw,34px);line-height:1.25}
.carta .nota{font-size:15px;line-height:1.5;opacity:.9}
.carta .valore{font-family:var(--serif);font-size:44px}
.carta.grazia{background:linear-gradient(170deg,#fffdf6,#f7e7bd);border-color:var(--oro);color:#3b2c06;
  box-shadow:0 0 0 6px rgba(244,214,140,.2),0 22px 40px rgba(0,0,0,.35)}
.carta.domanda{background:linear-gradient(170deg,#ffffff,#e4effc);border-color:#9cc0e6;color:var(--inchiostro);
  box-shadow:0 22px 40px rgba(0,0,0,.35)}
.carta.malus{background:linear-gradient(170deg,#2a2036,#150f1f);border-color:#4a3a60;color:#e5dcf2;
  box-shadow:0 22px 40px rgba(0,0,0,.45)}
.carta.retro{background:linear-gradient(170deg,var(--notte-2),#0d1628);border-color:#31456c;color:#9fb4d6}
.tavolo .barra-azioni{justify-content:center;margin-top:22px}

/* ---- modale ---- */
.velo{position:fixed;inset:0;background:rgba(12,22,40,.62);display:flex;align-items:flex-start;
  justify-content:center;padding:22px;overflow:auto;z-index:50}
.modale{background:var(--carta);border-radius:16px;padding:22px;width:100%;max-width:520px;
  margin:auto;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.modale h3{margin-bottom:6px}

/* ---- avviso ---- */
#avviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:var(--inchiostro);color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;text-align:center}
#avviso.vedi{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- ingresso ---- */
.porte{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
@media(max-width:620px){.porte{grid-template-columns:1fr}}
.porta{text-align:left;background:var(--carta);border:1px solid var(--bordo);border-radius:var(--r);
  padding:24px;box-shadow:0 10px 26px rgba(22,35,60,.07);display:grid;gap:8px}
.porta b{font-family:var(--serif);font-size:24px;font-weight:600}
.porta span{color:var(--testo-soft);font-size:14.5px;line-height:1.5}
.porta:hover{border-color:var(--azzurro-chiaro)}

.testata{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.testata .btn{margin-left:auto}
.nota-privacy{font-size:13px;color:var(--testo-soft);background:#f4f8fd;border:1px solid var(--bordo);
  border-radius:10px;padding:10px 13px}
@media print{.barra-azioni,.btn{display:none}}
/* --- Aggiunto per il sito Liceo digitale ---
   Il ritorno alla pagina iniziale: stessa forma di tutto il sito,
   con i colori di questa pagina. La freccia e' alta 44 pixel, la
   misura minima per toccarla col dito. */
.ritorno { max-width: 1120px; margin: 0 auto; padding: 0 18px 28px; }
.ritorno a { display: inline-flex; align-items: center; gap: .6em;
  min-height: 44px; color: #2c6bad; font-weight: 700; text-decoration: none; }
.ritorno .freccia { display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border: 2px solid currentColor; border-radius: 50%;
  font-size: 1.2rem; line-height: 1; }
.ritorno a:hover { text-decoration: underline; }
.ritorno a:hover .freccia { background: #2c6bad; color: #fff; }

</style>
</head>

let FH = null;                 // riferimento al file scelto dal docente
let statoFile = "assente";     // assente | attivo | dapermettere | errore
let ultimoSalvataggio = null;
let timerScrittura = null;
const supportaFile = () => typeof window.showSaveFilePicker === "function";

function apriIdb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("aureolissima", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("handle");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbPut(k,v){ return apriIdb().then(db=>new Promise((res,rej)=>{
  const t = db.transaction("handle","readwrite"); t.objectStore("handle").put(v,k);
  t.oncomplete = res; t.onerror = ()=>rej(t.error); })); }
function idbGet(k){ return apriIdb().then(db=>new Promise((res,rej)=>{
  const t = db.transaction("handle","readonly"); const q = t.objectStore("handle").get(k);
  q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); })); }
function idbDel(k){ return apriIdb().then(db=>new Promise((res,rej)=>{
  const t = db.transaction("handle","readwrite"); t.objectStore("handle").delete(k);
  t.oncomplete = res; t.onerror = ()=>rej(t.error); })); }

function programmaScrittura(){
  if(!FH || statoFile !== "attivo") return;
  clearTimeout(timerScrittura);
  timerScrittura = setTimeout(scriviFile, 700);
}
async function scriviFile(){
  if(!FH) return;
  try{
    const p = await FH.queryPermission({mode:"readwrite"});
    if(p !== "granted"){ statoFile = "dapermettere"; disegna(); return; }
    const w = await FH.createWritable();
    await w.write(JSON.stringify(D, null, 2));
    await w.close();
    ultimoSalvataggio = Date.now();
    aggiornaSpia();
  }catch(e){
    statoFile = "errore";
    avvisa("Non riesco a scrivere sul file collegato. Controlla che la cartella sia raggiungibile.");
    disegna();
  }
}
async function leggiFile(){
  const f = await FH.getFile();
  const txt = await f.text();
  if(txt.trim()){
    const dati = JSON.parse(txt);
    if(!dati || !Array.isArray(dati.classi)) throw new Error("struttura");
    D = Object.assign(vuoto(), dati);
    try{ localStorage.setItem(CHIAVE, JSON.stringify(D)); }catch(e){}
  }
  statoFile = "attivo";
  ultimoSalvataggio = Date.now();
}
function nomeFile(){ return FH ? FH.name : ""; }
function aggiornaSpia(){
  const e = document.getElementById("spiaFile");
  if(e) e.outerHTML = spiaFile();
}
function spiaFile(){
  if(statoFile === "assente") return `<span id="spiaFile"></span>`;
  const testo =
    statoFile === "attivo" ? `${esc(nomeFile())}${ultimoSalvataggio?` · salvato alle ${new Date(ultimoSalvataggio).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}`:""}`
    : statoFile === "dapermettere" ? "file collegato, da riattivare"
    : "file non raggiungibile";
  return `<button id="spiaFile" class="btn piccolo ${statoFile==="attivo"?"":"oro"}"
    data-act="${statoFile==="attivo"?"vaiImpostazioni":"riattivaFile"}"
    title="Archivio su file">${statoFile==="attivo"?"Salvataggio automatico attivo":"Riattiva il file"} · ${testo}</button>`;
}
async function ripristinaFile(){
  if(!supportaFile()) return;
  try{
    const h = await idbGet("file");
    if(!h) return;
    FH = h;
    const p = await h.queryPermission({mode:"readwrite"});
    if(p === "granted"){ await leggiFile(); }
    else { statoFile = "dapermettere"; }
  }catch(e){ FH = null; statoFile = "assente"; }
  disegna();
}

function aureola(pp, w){
  pp = pp||0;
  const R = 46, cx = 60, cy = 58;
  const a0 = -172*Math.PI/180, a1 = -8*Math.PI/180;
  const pt = t => { const a = a0 + (a1-a0)*t; return [cx + R*Math.cos(a), cy + R*Math.sin(a)]; };
  const frac = Math.max(0, Math.min(1, pp/100));
  const [x0,y0] = pt(0), [x1,y1] = pt(1), [xp,yp] = pt(frac);
  const f = n => n.toFixed(1);
  const dots = SOGLIE.map(s=>{
    const [x,y] = pt(s/100);
    const tap = TAPPE.includes(s);
    return `<circle cx="${f(x)}" cy="${f(y)}" r="${tap?6:4}" class="ad${pp>=s?" on":""}${tap?" tap":""}"><title>${s} PP</title></circle>`;
  }).join("");
  const grande = w >= 200;
  return `<svg class="aur" viewBox="0 0 120 62" width="${w}" height="${Math.round(w*62/120)}"
      role="img" aria-label="Aureola: ${pp} punti su 100">
    <path class="arco" d="M${f(x0)} ${f(y0)} A${R} ${R} 0 0 1 ${f(x1)} ${f(y1)}"/>
    ${frac>0.004?`<path class="prog" d="M${f(x0)} ${f(y0)} A${R} ${R} 0 0 1 ${f(xp)} ${f(yp)}"/>`:""}
    ${dots}
    <text class="num${pp>=100?" pieno":""}" x="60" y="${grande?48:49}" text-anchor="middle"
      font-size="${pp>999?24:30}">${pp}</text>
    ${grande?`<text class="eti" x="60" y="59" text-anchor="middle">PUNTI PARADISO</text>`:""}
  </svg>`;
}

function assegna(cid, sid, delta, causale){
  const s = studente(cid,sid); if(!s) return;
  delta = Math.round(Number(delta)||0);
  s.pp = Math.max(0, (s.pp||0) + delta);
  s.storico = s.storico || [];
  s.storico.unshift({ts:Date.now(), delta, causale:causale||"Movimento"});
  salva();
}

    della seconda parola («Marco R.»). Serve a proteggere la classe da occhi esterni, per esempio durante una lezione
    con la porta aperta o una videoconferenza.</p>
    <p><b>Che cosa non sono i PIN.</b> Il PIN del docente e quelli degli studenti servono a evitare scherzi tra compagni,
    non sono una misura di sicurezza informatica: chiunque abbia accesso fisico al dispositivo e competenze tecniche
    può leggere i dati salvati nel browser. Non inserire mai in Aureolissima informazioni delicate
    (salute, situazione familiare, provvedimenti disciplinari, convinzioni religiose personali).</p>
    <p><b>Conservazione e cancellazione.</b> I dati restano finché non li cancelli. Da Impostazioni puoi esportare un
    backup, cancellare un singolo slot, una classe intera o azzerare tutta l'app. Su richiesta di uno studente
    o di chi ne fa le veci, il docente cancella lo slot corrispondente: l'operazione è immediata e definitiva.</p>
    <p><b>Un consiglio pratico.</b> A fine anno scolastico esporta il backup se ti serve, poi azzera l'app.</p>
    <div class="barra-azioni" style="margin-top:18px"><button class="btn primario" data-act="indietroPrivacy">Torna indietro</button></div>
  </div>`;
}

    if(a.stato!==b.stato) return a.stato==="attesa" ? -1 : 1;
    return b.ts-a.ts;
  });
  const lista = rs.map(r=>{
    const s = studente(c.id, r.studId);

    return `<div class="mov">

        <small>${ora(r.ts)}</small>

  return `<div class="pannello">

function vDocRegistro(){
  const c = classe(U.classeId); if(!c) return vDocHome();
  const mov = [];
  c.studenti.forEach(s => (s.storico||[]).forEach(m => mov.push(Object.assign({nick:s.nick}, m))));
  mov.sort((a,b)=>b.ts-a.ts);
  const lista = mov.slice(0,300).map(m=>`<div class="mov">
    <div class="delta ${m.delta>=0?"su":"giu"}">${m.delta>0?"+":""}${m.delta}</div>
    <div class="causale"><b>${esc(mostra(m.nick))}</b><br>${esc(m.causale)}</div>
    <div class="ora">${ora(m.ts)}</div>

  return `<div class="pannello">
    <div class="testata">
      <div><h2>Registro · ${esc(c.nome)}</h2><small>${mov.length} movimenti, dal più recente.</small></div>
      <button class="btn piccolo fantasma" data-act="tornaClasse">Torna alla classe</button>

    ${mov.length? lista : `<div class="vuoto">Il registro è vuoto: qui finiranno tutti i punti dati e tolti, con orario e causale.</div>`}
  </div>`;
}

      <p>${esc(q.sp||"")}</p>
      <p>${e.ok?`Una richiesta da <b>+${q.pp} PP</b> è partita verso il docente, che la approverà.`
              :`Nessuna richiesta inviata questa volta: la domanda valeva <b>${q.pp} PP</b>. Prova con un'altra.`}</p>
      <div class="barra-azioni" style="margin-top:14px">
        <button class="btn primario" data-act="altroQuiz">Un'altra domanda</button>
        <button class="btn" data-act="tornaStud">Torna alla home</button>
      </div>
    </div>`;
  }

  const corpo = q.a
    ? `<div class="campo"><label for="rispQuiz">La tua risposta</label><input id="rispQuiz" type="text" autocomplete="off" placeholder="Scrivi qui"></div>`
    : `<div class="pila" style="gap:9px;margin-bottom:16px">${q.m.map((o,i)=>
        `<button class="btn pieno" style="justify-content:flex-start;text-align:left" data-act="rispondiQuiz" data-scelta="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;

  return `<div class="pannello" style="max-width:560px;margin:0 auto">
    <div class="testata"><div><h2>Quiz</h2><small>${q.a?"Risposta da scrivere":"Risposta a scelta multipla"} · risposta giusta, richiesta automatica al docente</small></div>
      <button class="btn piccolo fantasma" data-act="tornaStud">Indietro</button></div>
    <div style="display:inline-flex;align-items:baseline;gap:7px;background:linear-gradient(170deg,#fbf0d2,#f2dda2);
      border:1px solid #d9b85c;border-radius:999px;padding:5px 15px;margin-bottom:14px">
      <b style="font-family:var(--serif);font-size:20px;color:#6b5210">${q.pp}</b>
      <span style="font-size:13px;color:#6b5210">Punti Paradiso in palio</span></div>
    <p style="font-family:var(--serif);font-size:clamp(20px,3vw,26px);line-height:1.3">${esc(q.d)}</p>
    ${corpo}
    ${q.a?`<button class="btn primario pieno" data-act="rispondiQuiz">Rispondi</button>`:""}
    <div class="barra-azioni" style="margin-top:12px"><button class="btn fantasma" data-act="altroQuiz">Cambia domanda</button></div>
  </div>`;
}

function vStuStorico(){
  const s = studente(U.classeId, U.studId); if(!s) return vStuAccesso();
  const mov = (s.storico||[]);
  return `<div class="pannello" style="max-width:600px;margin:0 auto">
    <div class="testata"><div><h2>I tuoi movimenti</h2><small>${mov.length} voci</small></div>
      <button class="btn piccolo fantasma" data-act="tornaStud">Indietro</button></div>
    ${mov.length? mov.map(m=>`<div class="mov">
      <div class="delta ${m.delta>=0?"su":"giu"}">${m.delta>0?"+":""}${m.delta}</div>
      <div class="causale">${esc(m.causale)}</div>
      <div class="ora">${ora(m.ts)}</div></div>`).join("")
    : `<div class="vuoto">Ancora nessun punto. Si comincia dalla prossima lezione.</div>`}
  </div>`;
}

  if(f) f.focus();
}

/* ============================================================
   9. EVENTI
   ============================================================ */

document.addEventListener("click", ev=>{
  const velo = ev.target.closest("[data-velo]");
  if(velo && ev.target===velo){ chiudiModale(); return; }
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const c = classe(U.classeId);

  switch(act){

  /* --- navigazione --- */
  case "casa": vai("ingresso"); break;
  case "esci": U.sbloccato=false; U.studId=null; vai("ingresso"); break;
  case "vaiPrivacy": U.provenienza = U.vista; vai("privacy"); break;
  case "indietroPrivacy": vai(U.provenienza && U.provenienza!=="privacy" ? U.provenienza : "ingresso"); break;
  case "vaiDocente": vai(U.sbloccato ? "docHome" : "docPin"); break;
  case "vaiStudente": vai("stuAccesso"); break;
  case "tornaHome": vai("docHome"); break;
  case "tornaClasse": vai("docClasse"); break;
  case "vaiImpostazioni": vai("docImpostazioni"); break;
  case "apriClasse": vai("docClasse", {classeId:id}); break;
  case "apriMazzo": U.carta=null; vai("docMazzo"); break;
  case "apriRichieste": vai("docRichieste"); break;
  case "apriRegistro": vai("docRegistro"); break;
  case "chiudi": chiudiModale(); break;

  /* --- accesso docente --- */
  case "confermaPinDoc": {
    const v = document.getElementById("pinDoc").value.trim();
    if(v === D.pinDocente){ U.sbloccato = true; vai("docHome"); }
    else avvisa("PIN non riconosciuto. Quello iniziale è 1234.");
    break;
  }
  case "cambiaPinDoc": {
    const vecchio = document.getElementById("pinVecchio").value.trim();
    const nuovo = document.getElementById("pinNuovo").value.trim();
    if(vecchio !== D.pinDocente){ avvisa("Il PIN attuale non corrisponde."); break; }
    if(nuovo.length < 4){ avvisa("Il nuovo PIN deve avere almeno 4 caratteri."); break; }
    D.pinDocente = nuovo; salva(); avvisa("PIN aggiornato."); disegna(); break;
  }
  case "privacyLim": D.privacyLIM = !D.privacyLIM; salva();
    avvisa(D.privacyLIM ? "Privacy LIM attiva: i nomi sono mascherati." : "Privacy LIM disattivata."); disegna(); break;

  /* --- classi --- */
  case "nuovaClasse": modaleClasse(null); break;
  case "classeOpzioni": modaleClasse(U.classeId); break;
  case "salvaClasse": {
    const n = document.getElementById("mNomeClasse").value.trim();
    const ap = document.getElementById("mAperta").checked;
    if(n.length < 1){ avvisa("Dai un nome alla classe."); break; }
    if(id){ const cl = classe(id); cl.nome = n; cl.aperta = ap; }
    else { const nc = {id:uid(), nome:n, aperta:ap, studenti:[]}; D.classi.push(nc); U.classeId = nc.id; }
    salva(); chiudiModale(); disegna(); avvisa(id?"Classe aggiornata.":"Classe creata."); break;
  }
  case "toggleAperta": {
    c.aperta = c.aperta===false; salva(); disegna();
    avvisa(c.aperta!==false ? "Gli studenti possono iscriversi da soli." : "Iscrizioni chiuse: gli slot li crei tu.");
    break;
  }
  case "eliminaClasse": conferma("Eliminare la classe?",
    "Spariscono tutti gli slot, i punti e lo storico di questa classe. Non si torna indietro.",
    "Elimina la classe", ()=>{
      D.classi = D.classi.filter(x=>x.id!==id);
      D.richieste = D.richieste.filter(r=>r.classeId!==id);
      U.classeId = D.classi[0] ? D.classi[0].id : null;
      salva(); vai("docHome"); avvisa("Classe eliminata.");
    }); break;
  case "confermaAzione": { const f = AZIONE; AZIONE = null; chiudiModale(); if(f) f(); break; }

  /* --- slot --- */
  case "nuovoSlot": modaleSlot(null); break;
  case "slotOpzioni": modaleSlot(id); break;
  case "salvaSlot": {
    const nick = document.getElementById("mNick").value.trim();
    const pin = document.getElementById("mPin").value.trim();
    let santo = document.getElementById("mSanto").value;
    if(nick.length < 2){ avvisa("Serve un nickname di almeno due caratteri."); break; }
    if(pin.length < 4){ avvisa("Il PIN dello studente deve avere almeno 4 cifre."); break; }
    if(c.studenti.some(x=>x.id!==id && x.nick.toLowerCase()===nick.toLowerCase())){ avvisa("In questa classe c'è già un nickname uguale."); break; }
    if(!santo) santo = SANTI[Math.floor(Math.random()*SANTI.length)].n;
    if(id){ const s = studente(c.id,id); Object.assign(s,{nick,pin,santo}); }
    else { c.studenti.push({id:uid(), nick, pin, santo, pp:0, storico:[]}); }
    salva(); chiudiModale(); disegna(); avvisa(id?"Slot aggiornato.":"Slot creato."); break;
  }
  case "eliminaSlot": {
    const s = studente(c.id,id);
    conferma("Eliminare lo slot?", `«${s.nick}» sparisce con tutti i suoi punti e il suo storico. L'operazione è definitiva.`,
      "Elimina lo slot", ()=>{
        c.studenti = c.studenti.filter(x=>x.id!==id);
        D.richieste = D.richieste.filter(r=>r.studId!==id);
        salva(); disegna(); avvisa("Slot eliminato.");
      });
    break;
  }
  case "movimento": modaleMovimento(id); break;
  case "salvaMovimento": {
    const d = Number(document.getElementById("mDelta").value);
    const ca = document.getElementById("mCausale").value.trim() || "Assegnazione del docente";
    if(!d){ avvisa("Indica quanti punti dare o togliere."); break; }
    assegna(c.id, id, d, ca); chiudiModale(); disegna(); avvisa("Registrato."); break;
  }

  /* --- mazzo --- */
  case "pesca": {
    let k; do { k = MAZZO[Math.floor(Math.random()*MAZZO.length)]; } while(MAZZO.length>1 && k===U.carta);
    U.carta = k; U.svelata = false; disegna(); break;
  }
  case "svela": U.svelata = true; disegna(); break;
  case "applicaCarta": modaleCarta(); break;
  case "salvaCarta": {
    const sid = document.getElementById("mChi").value;
    const pp = Number(document.getElementById("mPp").value);
    assegna(c.id, sid, pp, "Domanda spot: " + U.carta.t);
    chiudiModale(); disegna(); avvisa("Punti assegnati."); break;
  }

  /* --- richieste --- */
  case "approva": {
    const r = D.richieste.find(x=>x.id===id);
    const m = MOTIVI.find(x=>x.id===r.tipo);
    assegna(r.classeId, r.studId, r.pp, (m?m.e.split(" (")[0]:"Richiesta") + ": " + r.testo);
    r.stato="approvata"; salva(); disegna(); avvisa("Approvata."); break;
  }
  case "modificaApprova": modaleApprovaMod(id); break;
  case "salvaApprovaMod": {
    const r = D.richieste.find(x=>x.id===id);
    const pp = Number(document.getElementById("mPpApp").value)||0;
    const m = MOTIVI.find(x=>x.id===r.tipo);
    assegna(r.classeId, r.studId, pp, (m?m.e.split(" (")[0]:"Richiesta") + ": " + r.testo);
    r.pp = pp; r.stato="approvata"; salva(); chiudiModale(); disegna(); avvisa("Approvata."); break;
  }
  case "respingi": {
    const r = D.richieste.find(x=>x.id===id);
    r.stato="respinta"; salva(); disegna(); avvisa("Richiesta respinta."); break;
  }

  /* --- studente --- */
  case "confermaAccessoStud": {
    const cid = document.getElementById("selClasse").value;
    const sid = document.getElementById("selStud").value;
    const pin = document.getElementById("pinStud").value.trim();
    const s = studente(cid,sid);
    if(!s){ avvisa("Scegli un nickname dall'elenco."); break; }
    if(s.pin !== pin){ avvisa("PIN sbagliato. Chiedi al docente se l'hai dimenticato."); break; }
    vai("stuHome", {classeId:cid, studId:sid}); break;
  }
  case "altraCuriosita": {
    let i; do { i = Math.floor(Math.random()*CURIOSITA.length); } while(CURIOSITA.length>1 && i===U.curioIdx);
    U.curioIdx = i; disegna(); break;
  }
  case "tornaStud": U.quizEsito=null; vai("stuHome"); break;
  case "vaiRichiesta": vai("stuRichiesta"); break;
  case "autoIscrizione": {
    const cid = document.getElementById("selClasse").value;
    U.classeId = cid; modaleIscrizione(cid); break;
  }
  case "proponiNick": {
    const campo = document.getElementById("mNick");
    if(campo){ campo.value = generaNick(id || U.classeId); campo.focus(); }
    break;
  }
  case "santoACaso": {
    const sel = document.getElementById("mSanto");
    if(sel){
      sel.value = SANTI[Math.floor(Math.random()*SANTI.length)].n;
      const d = document.getElementById("mSantoInfo"); if(d) d.innerHTML = infoSanto(sel.value);
    }
    break;
  }
  case "salvaIscrizione": {
    const cl = classe(id); if(!cl) break;
    const nick = document.getElementById("mNick").value.trim();
    const p1 = document.getElementById("mPin").value.trim();
    const p2 = document.getElementById("mPin2").value.trim();
    const santo = document.getElementById("mSanto").value || SANTI[Math.floor(Math.random()*SANTI.length)].n;
    if(nick.length < 2){ avvisa("Scegli un nickname, o premi Proponi."); break; }
    if(cl.studenti.some(s=>s.nick.toLowerCase()===nick.toLowerCase())){ avvisa("Questo nickname è già preso in classe. Cambialo."); break; }
    if(p1.length < 4){ avvisa("Il PIN deve avere almeno 4 cifre."); break; }
    if(p1 !== p2){ avvisa("I due PIN non coincidono."); break; }
    const s = {id:uid(), nick, pin:p1, santo, pp:0, storico:[]};
    cl.studenti.push(s); salva();
    vai("stuHome", {classeId:cl.id, studId:s.id, curioIdx:null});
    avvisa("Slot creato. Ti accompagna " + santo + ".");
    break;
  }
  case "vaiStorico": vai("stuStorico"); break;
  case "vaiQuiz": U.quizIdx=null; U.quizEsito=null; vai("stuQuiz"); break;
  case "altroQuiz": {
    let i; do { i = Math.floor(Math.random()*QUIZ.length); } while(QUIZ.length>1 && i===U.quizIdx);
    U.quizIdx=i; U.quizEsito=null; disegna(); break;
  }
  case "inviaRichiesta": {
    const tipo = document.getElementById("tipoRic").value;
    const testo = document.getElementById("testoRic").value.trim();
    let pp = Math.round(Number(document.getElementById("ppRic").value)||0);
    if(testo.length < 10){ avvisa("Scrivi qualche parola in più: il docente deve capire di che cosa si tratta."); break; }
    pp = Math.min(10, Math.max(1, pp));
    D.richieste.push({id:uid(), classeId:U.classeId, studId:U.studId, tipo, testo, pp, stato:"attesa", ts:Date.now()});
    salva(); vai("stuHome"); avvisa("Richiesta inviata. Ora tocca al docente."); break;
  }
  case "rispondiQuiz": {
    const q = QUIZ[U.quizIdx];
    const data = b.dataset.scelta != null ? b.dataset.scelta : (document.getElementById("rispQuiz")||{}).value;
    if(data==null || String(data).trim()===""){ avvisa("Scrivi una risposta."); break; }
    const ok = norm(data) === norm(q.r);
    U.quizEsito = {ok, data:String(data).trim()};
    if(ok){
      D.richieste.push({id:uid(), classeId:U.classeId, studId:U.studId, tipo:"quiz",
        testo:"Quiz: " + q.d, pp:q.pp, stato:"attesa", ts:Date.now()});
      salva();
    }
    disegna(); break;
  }

  /* --- archivio su file --- */
  case "collegaNuovo": {
    if(!supportaFile()){ avvisa("Questo browser non lo permette: servono Chrome o Edge."); break; }
    window.showSaveFilePicker({
      suggestedName:"aureolissima-dati.json",
      types:[{description:"Dati Aureolissima", accept:{"application/json":[".json"]}}]
    }).then(async h=>{
      FH = h; statoFile = "attivo";
      await idbPut("file", h);
      await scriviFile();
      disegna(); avvisa("File collegato: da ora salvo lì a ogni modifica.");
    }).catch(()=>{});
    break;
  }
  case "collegaEsistente": {
    if(!supportaFile()){ avvisa("Questo browser non lo permette: servono Chrome o Edge."); break; }
    window.showOpenFilePicker({
      types:[{description:"Dati Aureolissima", accept:{"application/json":[".json"]}}], multiple:false
    }).then(async ([h])=>{
      FH = h;
      try{ await leggiFile(); }
      catch(e){ statoFile = "errore"; avvisa("Quel file non contiene dati di Aureolissima."); disegna(); return; }
      await idbPut("file", h);
      U.classeId = D.classi[0] ? D.classi[0].id : null;
      disegna(); avvisa("File collegato: dati caricati.");
    }).catch(()=>{});
    break;
  }
  case "riattivaFile": {
    if(!FH){ avvisa("Nessun file collegato."); break; }
    FH.requestPermission({mode:"readwrite"}).then(async p=>{
      if(p !== "granted"){ avvisa("Permesso negato: i dati restano solo nel browser."); return; }
      try{ await leggiFile(); avvisa("Ripreso dal file: tutto al suo posto."); }
      catch(e){ statoFile = "attivo"; await scriviFile(); }
      disegna();
    }).catch(()=>{});
    break;
  }
  case "scriviOra": scriviFile().then(()=>{ avvisa("Salvato sul file."); disegna(); }); break;
  case "scollegaFile": {
    FH = null; statoFile = "assente"; ultimoSalvataggio = null;
    idbDel("file").catch(()=>{});
    disegna(); avvisa("File scollegato. I dati restano nella memoria del browser."); break;
  }
  case "esporta": {
    const blob = new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "aureolissima-backup-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); URL.revokeObjectURL(a.href); avvisa("Backup scaricato."); break;
  }
  case "importa": document.getElementById("fileBackup").click(); break;
  case "azzera": conferma("Azzerare tutto?",
    "Vengono cancellati classi, slot, punti e storico da questo browser. Non si torna indietro.",
    "Azzera tutta l'app", ()=>{
      D = vuoto(); salva(); U.sbloccato=false; U.classeId=null; vai("ingresso"); avvisa("Tutto azzerato.");
    }); break;
  }
});

document.addEventListener("change", ev=>{
  if(ev.target.id === "mSanto"){
    const d = document.getElementById("mSantoInfo");
    if(d) d.innerHTML = infoSanto(ev.target.value);
  }
  if(ev.target.id === "selClasse"){
    U.classeId = ev.target.value; disegna();
    const s = document.getElementById("selClasse"); if(s) s.focus();
  }
  if(ev.target.id === "fileBackup"){
    const f = ev.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const dati = JSON.parse(fr.result);
        if(!dati || !Array.isArray(dati.classi)) throw new Error("struttura");
        conferma("Importare il backup?", "I dati attuali di questo browser vengono sostituiti da quelli del file.",
          "Sostituisci i dati", ()=>{
            D = Object.assign(vuoto(), dati); U.classeId = D.classi[0] ? D.classi[0].id : null;
            salva(); disegna(); avvisa("Backup importato.");
          });
      }catch(e){ avvisa("Il file non è un backup valido di Aureolissima."); }
    };
    fr.readAsText(f);
  }
});

document.addEventListener("keydown", ev=>{
  if(ev.key === "Escape") chiudiModale();
  if(ev.key === "Enter"){
    const t = ev.target;
    if(t.id === "pinDoc"){ document.querySelector('[data-act="confermaPinDoc"]').click(); }
    if(t.id === "pinStud"){ document.querySelector('[data-act="confermaAccessoStud"]').click(); }
    if(t.id === "rispQuiz"){ document.querySelector('[data-act="rispondiQuiz"]').click(); }
  }
});

carica();
if(!U.classeId && D.classi.length) U.classeId = D.classi[0].id;
disegna();
ripristinaFile();
</script>
</body>
</html>
