<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tense Battle · Istruzioni per il docente</title>
<!-- La guida al gioco per i docenti. I testi non stanno qui: sono in
     istruzioni.txt, che si modifica con il Blocco note. Le schermate
     stanno nella cartella "immagini". -->
<script src="../js/tema.js?v=1"></script>
<link rel="stylesheet" href="../stile.css?v=10">
<style>
  /* La fila dei pulsanti con il nome di ogni fase */
  .fasi{
    max-width:var(--massimo); margin:0 auto var(--spazio);
    display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center;
    list-style:none; padding:0;
  }
  .fasi button{
    background:var(--fondo-lettura); color:var(--testo);
    border:3px solid transparent; font-weight:bold; padding:.5em 1em;
  }
  .fasi button:hover{ border-color:var(--bordo); background:var(--fondo-lettura); }
  .fasi button[aria-current="step"]{ background:var(--pulsante-fondo); color:var(--pulsante-testo); border-color:var(--bordo); }
  .fasi .n{ display:inline-block; min-width:1.4em; }

  .conta{ margin:0 0 .2em; font-weight:bold; color:var(--teal); }
  .riquadro p{ margin:0 0 .9em; }

  /* La schermata con i numeri sopra */
  .schermata{ position:relative; margin:1.2em 0; }
  .schermata img{ display:block; width:100%; height:auto; border-radius:var(--raggio); border:2px solid var(--testo); }
  .segno{
    position:absolute; transform:translate(-50%,-50%);
    width:2.3em; height:2.3em; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(.8rem, 1.6vw, 1.1rem);
    background:var(--pulsante-fondo); color:var(--pulsante-testo);
    border:3px solid var(--bordo); box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .segno:hover, .segno.attivo{ background:var(--giallo); color:var(--blu-notte); border-color:var(--blu-notte); transform:translate(-50%,-50%) scale(1.2); }

  /* L'elenco dei punti spiegati */
  .punti{ list-style:none; padding:0; margin:0 0 1em; }
  .punti li{ display:flex; gap:.8em; align-items:flex-start; padding:.6em .7em; border-radius:var(--raggio); border:3px solid transparent; cursor:default; }
  .punti li.attivo{ border-color:var(--bordo); background:var(--campo); }
  .punti .num{
    flex:none; width:2em; height:2em; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:bold;
    background:var(--pulsante-fondo); color:var(--pulsante-testo);
  }
  .punti li.attivo .num{ background:var(--giallo); color:var(--blu-notte); }

  .consiglio{ border-left:6px solid var(--verde); background:var(--campo); padding:.8em 1em; border-radius:var(--raggio); margin:0 0 1em; }
  .consiglio strong{ color:var(--verde); }
  pre.esempio{ background:var(--campo); color:var(--testo); border:2px solid var(--verde); border-radius:var(--raggio); padding:.8em 1em; overflow-x:auto; font-size:.95rem; line-height:1.5; margin:0 0 1em; }

  .avanti-indietro{ display:flex; justify-content:space-between; gap:1rem; margin-top:1.2em; flex-wrap:wrap; }
  .avanti-indietro button[hidden]{ display:none; }
  .avviso{ border:3px solid #E5484D; background:#FFF1F4; color:#8A1538; padding:.8em 1em; border-radius:var(--raggio); }
  .suggerimento-tasti{ max-width:var(--massimo); margin:0 auto; text-align:center; color:var(--testo-su-scuro); font-size:.95rem; }
</style>
</head>
<body>

<p class="ritorno su-scuro"><a href="index.html"><span class="freccia" aria-hidden="true">&larr;</span> Torna al gioco</a></p>

<h1 class="titolo-pagina">Tense Battle · come funziona</h1>

<nav aria-label="Le fasi della guida"><ul class="fasi" id="fasi"></ul></nav>

<main class="riquadro" id="fase" aria-live="polite">
  <p>Carico le istruzioni…</p>
</main>

<p class="suggerimento-tasti">Puoi sfogliare la guida anche con le frecce della tastiera.</p>

<script>
/* ================================================================
   LA GUIDA AL GIOCO

   La pagina legge i testi da istruzioni.txt e mostra una fase alla
   volta. Se la fase ha una schermata, sopra l'immagine compaiono i
   numeri dei punti spiegati sotto.

   DOVE STANNO I NUMERI SULLE SCHERMATE
   Qui sotto, per ogni schermata, c'è la posizione di ogni numero:
   la prima cifra è la distanza dal bordo sinistro, la seconda dal
   bordo in alto, tutte e due in percentuale. Sono state misurate
   sul gioco vero quando le schermate sono state scattate: se si
   rifanno le schermate, vanno rimisurate.
   ================================================================ */
const POSIZIONI = {
  ingaggio:  [[13.1,47.5], [28.7,72.8], [34.8,84.6]],
  squadre:   [[16.1,35.3], [16.1,45.2], [16.1,57.4], [16.1,66], [15.6,74.7], [69.4,81.8]],
  domanda:   [[76.5,4.6], [45.6,4.6], [20.7,46.7], [24.3,82.4], [40.6,70.2], [50,57.5]],
  risposta:  [[26.7,7.2], [18.4,51.3], [65.9,53.6], [35.2,66.2], [24.3,82.4], [31.5,82.9]],
  risultati: [[26.8,47.5], [37.3,69.6], [25.6,77.7], [74.4,77.7]],
  ruota:     [[23.3,34.2], [41.4,29.8], [41.4,52.8], [41.4,66.3], [87.6,66.3], [20.4,79.1]]
};

let FASI = [], cur = 0;
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Le parole fra due asterischi, *così*, diventano grassetto. */
const bold = t => esc(t).replace(/\*([^*]+)\*/g, "<strong>$1</strong>");

/* Legge il testo di istruzioni.txt e lo divide in fasi. Una riga
   che non comincia con una parola nota si attacca a quella prima. */
function leggiIstruzioni(testo, errori){
  const out = [];
  let fase = null, ultimo = null;
  testo.split(/\r?\n/).forEach((riga, k) => {
    const r = riga.trim();
    if (!r || r[0] === "#") { ultimo = null; return; }
    if (r.toUpperCase() === "[FASE]") { fase = {titolo:"", schermata:"", blocchi:[], punti:{}}; out.push(fase); ultimo = null; return; }
    if (!fase) { errori.push(`riga ${k + 1}: manca la riga [FASE] prima di questa`); return; }
    const m = riga.match(/^\s*(titolo|schermata|testo|consiglio|esempio|\d+)\s*:(.*)$/i);
    if (!m) {
      if (ultimo) ultimo.t += " " + r;
      else errori.push(`riga ${k + 1}: non capisco questa riga ("${r.slice(0, 40)}")`);
      return;
    }
    const chiave = m[1].toLowerCase(), val = m[2].trim();
    if (chiave === "titolo") { fase.titolo = val; ultimo = null; }
    else if (chiave === "schermata") { fase.schermata = val.toLowerCase(); ultimo = null; }
    else if (/^\d+$/.test(chiave)) { ultimo = {t:val}; fase.punti[+chiave] = ultimo; }
    else if (chiave === "esempio") {
      /* le righe dell'esempio restano come sono, senza unirle */
      const prima = fase.blocchi[fase.blocchi.length - 1];
      if (prima && prima.tipo === "esempio") prima.righe.push(m[2].replace(/^ /, ""));
      else fase.blocchi.push({tipo:"esempio", righe:[m[2].replace(/^ /, "")]});
      ultimo = null;
    }
    else { ultimo = {tipo:chiave, t:val}; fase.blocchi.push(ultimo); }
  });
  return out.filter((f, k) => {
    if (!f.titolo) { errori.push(`la fase numero ${k + 1} non ha il titolo: saltata`); return false; }
    if (f.schermata && !POSIZIONI[f.schermata]) { errori.push(`fase "${f.titolo}": la schermata "${f.schermata}" non esiste`); f.schermata = ""; }
    return true;
  });
}

function disegnaMenu(){
  $("fasi").innerHTML = FASI.map((f, k) =>
    `<li><button type="button" data-k="${k}" ${k === cur ? 'aria-current="step"' : ""}><span class="n">${k + 1}.</span> ${esc(f.titolo)}</button></li>`).join("");
  $("fasi").querySelectorAll("button").forEach(b => b.onclick = () => vai(+b.dataset.k));
}

function disegnaFase(){
  const f = FASI[cur];
  const numeri = Object.keys(f.punti).map(Number).sort((a, b) => a - b);
  const pos = POSIZIONI[f.schermata] || [];
  let h = `<p class="conta">Fase ${cur + 1} di ${FASI.length}</p><h2>${esc(f.titolo)}</h2>`;
  /* i paragrafi di testo vengono prima della schermata, i consigli e gli esempi dopo i punti */
  f.blocchi.filter(b => b.tipo === "testo").forEach(b => h += `<p>${bold(b.t)}</p>`);
  if (f.schermata) {
    h += `<div class="schermata"><img src="immagini/${f.schermata}.jpg" alt="Schermata del gioco: ${esc(f.titolo)}" width="1600" height="900">` +
      numeri.filter(n => pos[n - 1]).map(n => {
        const [x, y] = pos[n - 1];
        return `<button type="button" class="segno" data-n="${n}" aria-label="Punto ${n}" style="left:${Math.min(Math.max(x, 2), 98)}%;top:${Math.min(Math.max(y, 3.5), 96)}%">${n}</button>`;
      }).join("") + `</div>`;
  }
  if (numeri.length) h += `<ol class="punti">` + numeri.map(n => `<li data-n="${n}"><span class="num" aria-hidden="true">${n}</span><span>${bold(f.punti[n].t)}</span></li>`).join("") + `</ol>`;
  f.blocchi.forEach(b => {
    if (b.tipo === "esempio") h += `<pre class="esempio">${esc(b.righe.join("\n"))}</pre>`;
    if (b.tipo === "consiglio") h += `<p class="consiglio"><strong>Consiglio.</strong> ${bold(b.t)}</p>`;
  });
  h += `<div class="avanti-indietro">
      <button type="button" id="indietro" ${cur === 0 ? "hidden" : ""}>&larr; ${cur > 0 ? esc(FASI[cur - 1].titolo) : ""}</button>
      <button type="button" id="avanti" ${cur === FASI.length - 1 ? "hidden" : ""}>${cur < FASI.length - 1 ? esc(FASI[cur + 1].titolo) : ""} &rarr;</button>
    </div>`;
  $("fase").innerHTML = h;
  if ($("indietro")) $("indietro").onclick = () => vai(cur - 1);
  if ($("avanti")) $("avanti").onclick = () => vai(cur + 1);

  /* Quando si indica un numero sulla schermata si illumina la sua
     spiegazione, e al contrario. */
  const accendi = n => $("fase").querySelectorAll("[data-n]").forEach(e => e.classList.toggle("attivo", +e.dataset.n === n));
  $("fase").querySelectorAll(".segno").forEach(b => {
    b.onmouseenter = b.onfocus = () => accendi(+b.dataset.n);
    b.onclick = () => { accendi(+b.dataset.n); const li = $("fase").querySelector(`li[data-n="${b.dataset.n}"]`); if (li) li.scrollIntoView({block:"nearest", behavior:"smooth"}); };
  });
  $("fase").querySelectorAll(".punti li").forEach(li => li.onmouseenter = () => accendi(+li.dataset.n));
  $("fase").onmouseleave = () => accendi(0);
}

function vai(k){
  if (k < 0 || k >= FASI.length) return;
  cur = k;
  history.replaceState(null, "", "#fase-" + (k + 1));
  disegnaMenu(); disegnaFase();
  $("fasi").scrollIntoView({block:"nearest"});
}

/* se cambia l'indirizzo (per esempio con il tasto Indietro del
   browser), si mostra la fase giusta */
function faseDaIndirizzo(){
  const m = location.hash.match(/fase-(\d+)/);
  return m ? Math.min(Math.max(+m[1] - 1, 0), FASI.length - 1) : 0;
}
window.addEventListener("hashchange", () => { if (FASI.length) vai(faseDaIndirizzo()); });

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") vai(cur + 1);
  else if (e.key === "ArrowLeft") vai(cur - 1);
});

fetch("istruzioni.txt", {cache:"no-store"})
  .then(r => { if (!r.ok) throw new Error("risposta del server " + r.status); return r.text(); })
  .then(t => {
    const errori = [];
    FASI = leggiIstruzioni(t, errori);
    if (!FASI.length) throw new Error("nel file non c'è nessuna fase");
    /* si può aprire direttamente una fase, per esempio istruzioni.html#fase-3 */
    cur = faseDaIndirizzo();
    disegnaMenu(); disegnaFase();
    if (errori.length) $("fase").insertAdjacentHTML("afterbegin",
      `<div class="avviso"><strong>Alcune righe di istruzioni.txt vanno riviste.</strong><ul>${errori.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`);
  })
  .catch(e => {
    $("fase").innerHTML = `<div class="avviso"><strong>Non riesco a leggere il file istruzioni.txt.</strong><br>` +
      (location.protocol === "file:"
        ? "Hai aperto la pagina facendo doppio clic sul file: così i browser non lasciano leggere gli altri file della cartella. Apri il sito con anteprima.bat oppure dal suo indirizzo su GitHub Pages."
        : `Controlla che istruzioni.txt si trovi nella stessa cartella di questa pagina. Dettaglio tecnico: ${esc(e.message)}`) + `</div>`;
  });
</script>
</body>
</html>
