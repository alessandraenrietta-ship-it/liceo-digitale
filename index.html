<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liceo digitale</title>

  <!--
    Il numero dopo ?v= serve a far riscaricare il file quando cambia.
    Senza, il browser continua a usare per qualche minuto la copia
    vecchia e le modifiche non si vedono.
    QUANDO SI MODIFICA stile.css O js/home.js, SI AUMENTA IL NUMERO
    DI UNO anche qui sotto.
  -->
  <!-- La modalità chiara o scura, scelta dall'interruttore sulla pagina
       iniziale. Va letto prima del foglio di stile. -->
  <script src="js/tema.js?v=1"></script>
  <link rel="stylesheet" href="stile.css?v=10">

  <style>
    /* -------------------------------------------------------------
       Solo la DISPOSIZIONE degli elementi di questa pagina.
       I colori arrivano tutti da stile.css: qui si usano i loro nomi
       (var(--verde) e simili), mai i codici scritti a mano.
       ------------------------------------------------------------- */

    /* Tutti i riquadri della stessa misura, sempre: le colonne hanno
       una larghezza fissa e la griglia sta al centro. Se l'ultima riga
       è incompleta, lo spazio che avanza si divide fra i due lati
       invece di allargare un riquadro solo, che faceva disordine. */
    .griglia {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      margin-top: var(--spazio);
    }

    /* La fascia degli strumenti generali, sopra alle discipline. */
    .fascia-generali { margin-top: var(--spazio); }
    .fascia-generali .disciplina { margin: 0; }

    /* Ogni riquadro parte da una misura piccola e cresce fino a
       riempire la riga: cosi' non restano spazi vuoti, e se l'ultima
       riga ne ha meno si allargano tutti insieme invece di lasciarne
       uno lungo e gli altri corti. I nomi lunghi vanno a capo. */
    /* La larghezza la decide il numero di colonne calcolato da home.js:
       cosi' le righe restano piene e i riquadri sono tutti uguali. */
    .griglia > .disciplina {
      flex: 0 0 calc((100% - (var(--colonne, 3) - 1) * 0.7rem) / var(--colonne, 3));
    }
    .griglia > .disciplina.rilievo { flex: 1 1 100%; max-width: none; }

    /* Sul telefono: una colonna sola per i riquadri, due piastrelle per
       riga per le discipline in costruzione. */
    @media (max-width: 34rem) {
      .griglia > .disciplina { flex: 1 1 100%; }
    }

    .disciplina {
      border: 2px solid var(--verde);
      border-radius: var(--raggio);
      background: var(--fondo-lettura);
      overflow: hidden;
    }

    /* Le discipline ancora in costruzione: righe basse, su una riga
       sola, con il nome in tono minore. Sono tante, e da piene
       occupavano piu' spazio di quelle che si possono davvero usare. */
    .disciplina.spenta {
      border-style: dashed;
      border-color: var(--teal);
      border-width: 1px;
      align-self: start;
    }

    .disciplina.spenta .disciplina-spenta-testo {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.1em 0.5em;
      padding: 0.35em 0.7em;
    }

    .disciplina.spenta .disciplina-nome {
      font-size: 0.92rem;
      font-weight: normal;
    }

    .disciplina.spenta .disciplina-stato {
      margin: 0;
      font-size: 0.78rem;
    }

    /* Disciplina con almeno un artefatto pronto da aprire: una fascia
       verde sul lato sinistro. */
    .disciplina.con-artefatto {
      border-left-width: 10px;
    }

    /* Riquadro degli strumenti che valgono per tutte le discipline:
       occupa tutta la riga, con bordo e titolo più marcati, per
       distinguersi dalle materie. */
    .disciplina.rilievo {
      grid-column: 1 / -1;
      border-width: 3px;
    }

    .disciplina.rilievo .disciplina-testata {
      padding: 1em;
      text-align: center;
    }

    .disciplina.rilievo .disciplina-nome {
      font-size: 1.15rem;
    }

    /* Dentro il riquadro in evidenza gli strumenti non sono un elenco
       ma riquadri affiancati, uno per strumento, della stessa misura
       di quelli delle discipline. Su schermo stretto si incolonnano
       da soli. */
    .disciplina.rilievo .elenco-artefatti {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      padding: 0.8em 1em 1em;
    }

    .disciplina.rilievo .elenco-artefatti li { flex: 1 1 11rem; max-width: 18rem; }

    .disciplina.rilievo .elenco-artefatti li {
      padding: 0.8em 1em;
      border: 2px solid var(--verde);
      border-radius: var(--raggio);
    }

    /* Strumento pronto da aprire: la stessa fascia verde delle
       discipline con un artefatto pronto. */
    .disciplina.rilievo .elenco-artefatti li.pronto {
      border-left-width: 10px;
    }

    /* Posto riservato per uno strumento che arriverà: tratteggiato,
       come le discipline in costruzione. */
    .disciplina.rilievo .elenco-artefatti li.in-costruzione {
      border-style: dashed;
      border-color: var(--teal);
    }

    .disciplina.rilievo .elenco-artefatti li.in-costruzione .artefatto-titolo {
      color: var(--teal);
    }

    /* Qui la descrizione non si mostra: serve a tenere i riquadri
       della stessa misura di quelli delle discipline. Per rimetterla,
       si cancellano le tre righe qui sotto. */
    .disciplina.rilievo .artefatto-descrizione {
      display: none;
    }

    /* La testata è un pulsante: si raggiunge e si apre con la tastiera */
    .disciplina-testata {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0.8em 1em;
      text-align: left;
      font-weight: normal;
      color: var(--testo);
      background: none;
      border: 0;
      border-radius: 0;
    }

    .disciplina-testata:hover { background: none; }

    .disciplina-spenta-testo {
      padding: 0.8em 1em;
    }

    .disciplina-nome {
      display: block;
      font-weight: bold;
      color: var(--verde);
    }

    .disciplina.spenta .disciplina-nome { color: var(--teal); }

    .disciplina-stato {
      display: block;
      margin-top: 0.15em;
      font-size: 0.9rem;
      color: var(--teal);
    }

    /* I titoli degli strumenti pronti: uno per riga, con il pallino,
       come un elenco. Non è un vero elenco <ul> perché stanno dentro
       un pulsante, che non lo può contenere. */
    .disciplina-stato .artefatto-pronto {
      display: block;
      padding-left: 0.9em;
      text-indent: -0.9em;
    }

    .disciplina-stato .artefatto-pronto::before { content: "\2022  "; }

    .disciplina-testata .disciplina-nome { text-decoration: underline; }
    .disciplina-testata[aria-expanded="true"] .disciplina-nome { text-decoration: none; }

    /* Quando la scheda è aperta, l'elenco dei titoli qui in cima
       sparisce: subito sotto ci sono gli stessi titoli, quelli veri su
       cui si clicca, e vedendoli due volte si sbaglia bersaglio. */
    .disciplina-testata[aria-expanded="true"] .disciplina-stato { display: none; }

    .elenco-artefatti {
      margin: 0;
      padding: 0 1em 0.9em;
      list-style: none;
      border-top: 2px solid var(--verde);
    }

    .elenco-artefatti li { padding-top: 0.8em; }

    .artefatto-titolo { font-weight: bold; }

    .artefatto-descrizione {
      margin: 0.15em 0 0;
      font-size: 0.92rem;
    }

    .artefatto-stato {
      display: inline-block;
      margin-top: 0.15em;
      margin-left: 0.4em;
      font-size: 0.85rem;
      color: var(--teal);
    }

    /* Il riquadro della presentazione: testo e pulsante al centro,
       come il titolo. */
    .presentazione-testo { text-align: center; }
    .presentazione-testo:last-child { margin-bottom: 0; }

    /* Il titolo del sito e, sotto, il nome della scuola: piu' piccolo
       e staccato di poco, come una firma. */
    .titolo-sito { margin-bottom: 0.15rem; }

    .scuola {
      margin-bottom: var(--spazio);
      font-size: 1.05rem;
      letter-spacing: 0.04em;
    }

    /* Il video non sta dentro a un riquadro: niente cornice gialla,
       niente fondo crema, niente scritte. Solo il video. */
    .riquadro-video {
      max-width: 44rem;
      margin: 0 auto var(--spazio);
      padding: 0;
      background: none;
      border: 0;
    }

    /* L'anteprima della presentazione: un rettangolo 16:9, come lo
       schermo di un video. Finché non si clicca non è la
       presentazione vera, ma un disegno fatto con i colori del sito:
       così la pagina iniziale non deve scaricare niente. */
    /* Anche la cornice del video ha lo stesso fondo: nell'istante prima
       che la presentazione compaia non si vede il nero. */
    .anteprima-presentazione iframe { background: #12507A; }

    .anteprima-presentazione {
      position: relative;
      max-width: 44rem;
      margin: 0 auto var(--spazio);
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: var(--raggio);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
      background: linear-gradient(118deg, #9ACB4B 0%, #2FA96B 22%, #1B8C86 48%, #12507A 74%, #08203F 100%);
    }

    /* Se qualcuno ha spento JavaScript, al posto del video resta un
       collegamento alla presentazione. */
    .senza-javascript {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .senza-javascript a { color: #FFFFFF; font-weight: bold; }

    /* Quando si avvia, la presentazione prende tutto il rettangolo */
    .anteprima-presentazione iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .gruppo-docenti { margin-top: var(--spazio); }

    .accesso { max-width: 22rem; }
    .accesso button { margin-top: 0.6em; }

    /* La barra sopra le discipline: il menù dell'ordine a sinistra,
       il pulsantino per richiudere la sezione a destra. */
    .barra-sezione {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.6rem;
      margin-top: 0.4rem;
    }

    .gruppo-ordine {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .etichetta-ordine {
      margin: 0;
      font-size: 0.9rem;
      color: var(--teal);
    }

    .menu-ordine {
      width: auto;
      padding: 0.35em 0.6em;
      font-size: 0.9rem;
    }

    .pulsante-esci {
      padding: 0.35em 0.9em;
      font-size: 0.85rem;
      background: transparent;
      color: var(--teal);
      border: 2px solid var(--teal);
    }

    .pulsante-esci:hover {
      background: var(--teal);
      color: var(--testo-su-scuro);
    }

    .messaggio-errore {
      margin-top: 0.6em;
      font-weight: bold;
      color: var(--verde);
    }

    /* La fascia delle discipline ancora in costruzione: piastrelle
       piccole, tutte uguali, centrate. Non stanno nella griglia grande
       perché lì sarebbero larghe come i riquadri veri. */
    .in-costruzione-fascia {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 0.8rem;
    }

    .in-costruzione-fascia .disciplina.spenta {
      /* Crescono insieme fino a riempire la riga, ma non oltre una certa
         misura: due piastrelle larghe il doppio delle altre facevano
         disordine. Quello che avanza si divide fra i due lati. */
      flex: 1 1 8rem;
      max-width: 12rem;
    }

    .in-costruzione-fascia .disciplina-spenta-testo {
      justify-content: center;
      text-align: center;
      min-height: 2.4em;
      align-items: center;
    }

    .in-costruzione-fascia .disciplina-nome {
      line-height: 1.15;
    }

    /* Le scritte che servono solo a chi si fa leggere la pagina: non
       si vedono, ma i lettori di schermo le leggono. */
    .solo-lettori {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* L'interruttore dei colori: piccolo e discreto, in alto a destra. */
    .riga-tema {
      max-width: var(--massimo);
      margin: 0 auto 0.4rem;
      text-align: right;
    }

    .interruttore-tema {
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 1.3rem;
      line-height: 1;
      background: transparent;
      color: var(--testo-su-scuro);
      border: 2px solid var(--bordo);
      border-radius: 50%;
    }

    .interruttore-tema:hover {
      background: var(--bordo);
      color: var(--blu-notte);
    }

    /* Sul telefono le piastrelle stanno due per riga: una sola per riga
       lascerebbe mezza pagina vuota. Sta qui in fondo perché deve venire
       dopo la misura fissa scritta più sopra. */
    @media (max-width: 34rem) {
      .in-costruzione-fascia .disciplina.spenta { width: calc(50% - 0.2rem); }
    }

    .segnalazioni li { margin-bottom: 0.5em; }
  </style>
</head>

<body>

  <!--
    Questa pagina non contiene l'elenco degli artefatti: lo legge dal
    file artefatti.txt, che sta in questa stessa cartella. Per
    aggiungere o togliere qualcosa dal sito si modifica quel file.
  -->

  <!-- L'interruttore fra colori chiari e scuri. La scelta vale per
       tutte le pagine del sito e resta ricordata su questo computer. -->
  <div id="interruttore-tema" class="riga-tema"></div>

  <!-- TESTO MODIFICABILE: il titolo e la riga della scuola -->
  <h1 class="titolo-pagina titolo-sito">Liceo digitale</h1>
  <p class="titolo-pagina scuola">I.I.S. Giulio Natta</p>

  <!-- TESTO MODIFICABILE: puoi cambiare le due righe qui sotto.
       Questo riquadro sta fuori dalle sezioni con la password: la
       presentazione la vede chiunque apra il sito, anche le famiglie. -->
  <section class="riquadro riquadro-video" aria-label="Presentazione del Liceo digitale">
    <!-- L'anteprima: finché non si clicca è solo un disegno leggero.
         La presentazione vera (che pesa) si carica soltanto quando
         qualcuno la avvia, così la pagina iniziale resta veloce. -->
    <div class="anteprima-presentazione" id="anteprima-presentazione">
      <noscript>
        <p class="senza-javascript">
          <a href="presentazione-liceo-digitale/">Guarda la presentazione</a>
        </p>
      </noscript>
    </div>
  </section>

  <section class="riquadro" aria-labelledby="titolo-studenti">
    <h2 id="titolo-studenti">Per gli studenti</h2>

    <div id="accesso-studenti" class="accesso">
      <form id="modulo-studenti">
        <label for="parola-studenti">Password</label>
        <input type="password" id="parola-studenti" name="parola-studenti"
               autocomplete="off">
        <button type="submit">Entra</button>
        <p id="errore-studenti" class="messaggio-errore" role="alert"></p>
      </form>
    </div>

    <div id="area-studenti" hidden>
      <div class="barra-sezione" id="barra-studenti"></div>
      <div id="discipline-studenti" class="griglia"></div>
    </div>
  </section>

  <section class="riquadro" aria-labelledby="titolo-docenti">
    <h2 id="titolo-docenti">Per i docenti</h2>

    <div id="accesso-docenti" class="accesso">
      <form id="modulo-docenti">
        <label for="parola-docenti">Password</label>
        <input type="password" id="parola-docenti" name="parola-docenti"
               autocomplete="off">
        <button type="submit">Entra</button>
        <p id="errore-docenti" class="messaggio-errore" role="alert"></p>
      </form>
    </div>

    <div id="area-docenti" hidden>
      <div class="barra-sezione" id="barra-docenti"></div>
      <div id="discipline-docenti" class="griglia"></div>
    </div>
  </section>

  <section class="riquadro segnalazioni" id="segnalazioni" hidden
           aria-labelledby="titolo-segnalazioni">
    <h2 id="titolo-segnalazioni">Righe del registro da controllare</h2>
    <p>Queste righe di <strong>artefatti.txt</strong> non sono state capite
       e sono state saltate. Il resto del sito funziona lo stesso.</p>
    <ul id="elenco-segnalazioni"></ul>
  </section>

  <script src="js/home.js?v=20"></script>
  <script>Tema.interruttore("interruttore-tema");</script>

  <script>
    /* La presentazione nel riquadro della pagina iniziale.
       Parte da sola e muta, e non ha nessuna scritta sopra: prima
       c'era un disegno di copertina, ma con la presentazione che parte
       da sola finiva per sovrapporsi alle scene. Mentre carica si vede
       il fondo colorato del riquadro, e basta. */
    (function () {
      "use strict";
      var riquadro = document.getElementById("anteprima-presentazione");
      if (!riquadro) { return; }

      var cornice = document.createElement("iframe");
      cornice.src = "presentazione-liceo-digitale/";
      cornice.title = "Presentazione del Liceo digitale";
      cornice.allow = "autoplay; fullscreen";
      cornice.addEventListener("load", function () {
        /* Riparte da capo: mentre il file finiva di caricarsi, la
           presentazione era già andata avanti di qualche secondo. */
        var dentro = cornice.contentWindow;
        if (dentro && typeof dentro.riavviaAnteprima === "function") {
          dentro.riavviaAnteprima();
        }
      });
      riquadro.appendChild(cornice);

    }());
  </script>

</body>
</html>
