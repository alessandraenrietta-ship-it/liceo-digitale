<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liceo digitale</title>

  <!--
    Il numero dopo ?v= serve a far riscaricare il file quando cambia.
    Senza, il browser continua a usare per qualche minuto la copia
    vecchia e le modifiche non si vedono.
    QUANDO SI MODIFICA stile.css O js/home.js, SI AUMENTA IL NUMERO
    DI UNO anche qui sotto.
  -->
  <!-- La modalità chiara o scura, scelta dall'interruttore sulla pagina
       iniziale. Va letto prima del foglio di stile. -->
  <script src="js/tema.js?v=1"></script>
  <link rel="stylesheet" href="stile.css?v=7">

  <style>
    /* -------------------------------------------------------------
       Solo la DISPOSIZIONE degli elementi di questa pagina.
       I colori arrivano tutti da stile.css: qui si usano i loro nomi
       (var(--verde) e simili), mai i codici scritti a mano.
       ------------------------------------------------------------- */

    .griglia {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      gap: 0.8rem;
      margin-top: var(--spazio);
    }

    .disciplina {
      border: 2px solid var(--verde);
      border-radius: var(--raggio);
      background: var(--fondo-lettura);
      overflow: hidden;
    }

    .disciplina.spenta {
      border-style: dashed;
      border-color: var(--teal);
    }

    /* Disciplina con almeno un artefatto pronto da aprire: una fascia
       verde sul lato sinistro. */
    .disciplina.con-artefatto {
      border-left-width: 10px;
    }

    /* Riquadro degli strumenti che valgono per tutte le discipline:
       occupa tutta la riga, con bordo e titolo più marcati, per
       distinguersi dalle materie. */
    .disciplina.rilievo {
      grid-column: 1 / -1;
      border-width: 3px;
    }

    .disciplina.rilievo .disciplina-testata {
      padding: 1em;
      text-align: center;
    }

    .disciplina.rilievo .disciplina-nome {
      font-size: 1.15rem;
    }

    /* Dentro il riquadro in evidenza gli strumenti non sono un elenco
       ma riquadri affiancati, uno per strumento, della stessa misura
       di quelli delle discipline. Su schermo stretto si incolonnano
       da soli. */
    .disciplina.rilievo .elenco-artefatti {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      gap: 0.8rem;
      padding: 0.8em 1em 1em;
    }

    .disciplina.rilievo .elenco-artefatti li {
      padding: 0.8em 1em;
      border: 2px solid var(--verde);
      border-radius: var(--raggio);
    }

    /* Strumento pronto da aprire: la stessa fascia verde delle
       discipline con un artefatto pronto. */
    .disciplina.rilievo .elenco-artefatti li.pronto {
      border-left-width: 10px;
    }

    /* Posto riservato per uno strumento che arriverà: tratteggiato,
       come le discipline in costruzione. */
    .disciplina.rilievo .elenco-artefatti li.in-costruzione {
      border-style: dashed;
      border-color: var(--teal);
    }

    .disciplina.rilievo .elenco-artefatti li.in-costruzione .artefatto-titolo {
      color: var(--teal);
    }

    /* Qui la descrizione non si mostra: serve a tenere i riquadri
       della stessa misura di quelli delle discipline. Per rimetterla,
       si cancellano le tre righe qui sotto. */
    .disciplina.rilievo .artefatto-descrizione {
      display: none;
    }

    /* La testata è un pulsante: si raggiunge e si apre con la tastiera */
    .disciplina-testata {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0.8em 1em;
      text-align: left;
      font-weight: normal;
      color: var(--testo);
      background: none;
      border: 0;
      border-radius: 0;
    }

    .disciplina-testata:hover { background: none; }

    .disciplina-spenta-testo {
      padding: 0.8em 1em;
    }

    .disciplina-nome {
      display: block;
      font-weight: bold;
      color: var(--verde);
    }

    .disciplina.spenta .disciplina-nome { color: var(--teal); }

    .disciplina-stato {
      display: block;
      margin-top: 0.15em;
      font-size: 0.9rem;
      color: var(--teal);
    }

    /* I titoli degli strumenti pronti: uno per riga, con il pallino,
       come un elenco. Non è un vero elenco <ul> perché stanno dentro
       un pulsante, che non lo può contenere. */
    .disciplina-stato .artefatto-pronto {
      display: block;
      padding-left: 0.9em;
      text-indent: -0.9em;
    }

    .disciplina-stato .artefatto-pronto::before { content: "\2022  "; }

    .disciplina-testata .disciplina-nome { text-decoration: underline; }
    .disciplina-testata[aria-expanded="true"] .disciplina-nome { text-decoration: none; }

    /* Quando la scheda è aperta, l'elenco dei titoli qui in cima
       sparisce: subito sotto ci sono gli stessi titoli, quelli veri su
       cui si clicca, e vedendoli due volte si sbaglia bersaglio. */
    .disciplina-testata[aria-expanded="true"] .disciplina-stato { display: none; }

    .elenco-artefatti {
      margin: 0;
      padding: 0 1em 0.9em;
      list-style: none;
      border-top: 2px solid var(--verde);
    }

    .elenco-artefatti li { padding-top: 0.8em; }

    .artefatto-titolo { font-weight: bold; }

    .artefatto-descrizione {
      margin: 0.15em 0 0;
      font-size: 0.92rem;
    }

    .artefatto-stato {
      display: inline-block;
      margin-top: 0.15em;
      margin-left: 0.4em;
      font-size: 0.85rem;
      color: var(--teal);
    }

    /* Il riquadro della presentazione: testo e pulsante al centro,
       come il titolo. */
    .presentazione-testo { text-align: center; }
    .presentazione-testo:last-child { margin-bottom: 0; }

    /* Il video non sta dentro a un riquadro: niente cornice gialla,
       niente fondo crema, niente scritte. Solo il video. */
    .riquadro-video {
      max-width: 44rem;
      margin: 0 auto var(--spazio);
      padding: 0;
      background: none;
      border: 0;
    }

    /* L'anteprima della presentazione: un rettangolo 16:9, come lo
       schermo di un video. Finché non si clicca non è la
       presentazione vera, ma un disegno fatto con i colori del sito:
       così la pagina iniziale non deve scaricare niente. */
    .anteprima-presentazione {
      position: relative;
      max-width: 44rem;
      margin: 0 auto var(--spazio);
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: var(--raggio);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
      background: linear-gradient(118deg, #9ACB4B 0%, #2FA96B 22%, #1B8C86 48%, #12507A 74%, #08203F 100%);
    }

    .anteprima-avvio {
      position: absolute;
      inset: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      background: none;
      border: 0;
      border-radius: 0;
      color: #FFFFFF;
      cursor: pointer;
    }

    .anteprima-avvio:hover { background: rgba(0, 0, 0, 0.18); }

    .anteprima-titolo {
      font-size: clamp(1.4rem, 4.5vw, 2.6rem);
      font-weight: bold;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    /* Il triangolo del "riproduci", dentro un tondo chiaro */
    .anteprima-freccia {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: var(--blu-notte);
      font-size: 1.6rem;
      padding-left: 0.18em;   /* il triangolo sembra storto se centrato */
    }

    .anteprima-avvio:hover .anteprima-freccia { background: #FFFFFF; }

    .anteprima-durata {
      font-size: 0.95rem;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* Quando si avvia, la presentazione prende tutto il rettangolo */
    .anteprima-presentazione iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .gruppo-docenti { margin-top: var(--spazio); }

    .accesso { max-width: 22rem; }
    .accesso button { margin-top: 0.6em; }

    /* Collegamento per richiudere una sezione rimasta aperta */
    .riga-esci {
      margin: var(--spazio) 0 0;
      text-align: right;
    }

    .collegamento-esci {
      padding: 0;
      background: none;
      color: var(--teal);
      font-size: 0.85rem;
      font-weight: normal;
      text-decoration: underline;
    }

    .collegamento-esci:hover {
      background: none;
      color: var(--verde);
    }

    .messaggio-errore {
      margin-top: 0.6em;
      font-weight: bold;
      color: var(--verde);
    }

    /* L'interruttore dei colori: piccolo e discreto, in alto a destra. */
    .riga-tema {
      max-width: var(--massimo);
      margin: 0 auto 0.4rem;
      text-align: right;
    }

    .interruttore-tema {
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 1.3rem;
      line-height: 1;
      background: transparent;
      color: var(--testo-su-scuro);
      border: 2px solid var(--bordo);
      border-radius: 50%;
    }

    .interruttore-tema:hover {
      background: var(--bordo);
      color: var(--blu-notte);
    }

    .segnalazioni li { margin-bottom: 0.5em; }
  </style>
</head>

<body>

  <!--
    Questa pagina non contiene l'elenco degli artefatti: lo legge dal
    file artefatti.txt, che sta in questa stessa cartella. Per
    aggiungere o togliere qualcosa dal sito si modifica quel file.
  -->

  <!-- L'interruttore fra colori chiari e scuri. La scelta vale per
       tutte le pagine del sito e resta ricordata su questo computer. -->
  <div id="interruttore-tema" class="riga-tema"></div>

  <h1 class="titolo-pagina">Liceo digitale</h1>

  <!-- TESTO MODIFICABILE: puoi cambiare le due righe qui sotto.
       Questo riquadro sta fuori dalle sezioni con la password: la
       presentazione la vede chiunque apra il sito, anche le famiglie. -->
  <section class="riquadro riquadro-video" aria-label="Presentazione del Liceo digitale">
    <!-- L'anteprima: finché non si clicca è solo un disegno leggero.
         La presentazione vera (che pesa) si carica soltanto quando
         qualcuno la avvia, così la pagina iniziale resta veloce. -->
    <div class="anteprima-presentazione" id="anteprima-presentazione">
      <button type="button" class="anteprima-avvio" id="avvia-presentazione">
        <span class="anteprima-titolo">Liceo Digitale</span>
        <span class="anteprima-freccia" aria-hidden="true">&#9654;</span>
        <span class="anteprima-durata">Guarda la presentazione &middot; 1:53</span>
      </button>
    </div>
  </section>

  <section class="riquadro" aria-labelledby="titolo-studenti">
    <h2 id="titolo-studenti">Per gli studenti</h2>

    <div id="accesso-studenti" class="accesso">
      <form id="modulo-studenti">
        <label for="parola-studenti">Password</label>
        <input type="password" id="parola-studenti" name="parola-studenti"
               autocomplete="off">
        <button type="submit">Entra</button>
        <p id="errore-studenti" class="messaggio-errore" role="alert"></p>
      </form>
    </div>

    <div id="area-studenti" hidden>
      <p id="riassunto-studenti"></p>
      <div id="discipline-studenti" class="griglia"></div>
    </div>
  </section>

  <section class="riquadro" aria-labelledby="titolo-docenti">
    <h2 id="titolo-docenti">Per i docenti</h2>

    <div id="accesso-docenti" class="accesso">
      <form id="modulo-docenti">
        <label for="parola-docenti">Password</label>
        <input type="password" id="parola-docenti" name="parola-docenti"
               autocomplete="off">
        <button type="submit">Entra</button>
        <p id="errore-docenti" class="messaggio-errore" role="alert"></p>
      </form>
    </div>

    <div id="area-docenti" hidden>
      <p id="riassunto-docenti"></p>
      <div id="discipline-docenti" class="griglia"></div>
    </div>
  </section>

  <section class="riquadro segnalazioni" id="segnalazioni" hidden
           aria-labelledby="titolo-segnalazioni">
    <h2 id="titolo-segnalazioni">Righe del registro da controllare</h2>
    <p>Queste righe di <strong>artefatti.txt</strong> non sono state capite
       e sono state saltate. Il resto del sito funziona lo stesso.</p>
    <ul id="elenco-segnalazioni"></ul>
  </section>

  <script src="js/home.js?v=12"></script>
  <script>Tema.interruttore("interruttore-tema");</script>

  <script>
    /* L'anteprima della presentazione: al clic, al posto del disegno
       compare la presentazione vera, dentro allo stesso rettangolo.
       Si carica solo adesso: prima la pagina iniziale non scarica
       niente di pesante. */
    (function () {
      "use strict";
      var riquadro = document.getElementById("anteprima-presentazione");
      var avvio = document.getElementById("avvia-presentazione");
      if (!riquadro || !avvio) { return; }

      var cornice = null;

      avvio.addEventListener("click", function () {
        cornice = document.createElement("iframe");
        cornice.src = "presentazione-liceo-digitale/";
        cornice.title = "Presentazione del Liceo digitale";
        cornice.allow = "autoplay; fullscreen";
        riquadro.textContent = "";
        riquadro.appendChild(cornice);
        cornice.focus();
      });

    }());
  </script>

</body>
</html>
